name: drushti_blind_assistant
description: Drushti - Smart AI Blind Assistant System for Visually Impaired
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: 0.11.4
  tflite_flutter: 0.12.1
  google_mlkit_text_recognition: 0.13.1
  speech_to_text: 7.3.0
  flutter_tts: 4.2.5
  permission_handler: 12.0.1
  vibration: 3.1.6
  wakelock_plus: 1.4.0
  path_provider: 2.1.5
  get: 4.7.3
  provider: 6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/yolomodel.tflite
    - assets/labels/coco_labels.txt
